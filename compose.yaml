services:
  forgeclaw:
    build: .
    image: forgeclaw:local
    restart: unless-stopped
    init: true
    ports:
      # Bind to localhost. Put a trusted HTTPS reverse proxy in front for remote access.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      FORGECLAW_DATABASE_PATH: /app/data/forgeclaw.sqlite3
      FORGECLAW_LOG_LEVEL: ${FORGECLAW_LOG_LEVEL:-INFO}
    volumes:
      - forgeclaw_data:/app/data
      # Developer Mode accesses host repositories. Restrict this mount to trusted repositories.
      - ${FORGECLAW_WORKSPACE_ROOT:?Set FORGECLAW_WORKSPACE_ROOT to a trusted host repo directory}:/workspace
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  forgeclaw_data:
