[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeclaw"
version = "0.3.0"
description = "Free-first multi-agent debate and coding workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "httpx>=0.27,<1.0",
  "python-dotenv>=1.0,<2.0",
  "mcp>=1.9,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
include = ["forgeclaw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
